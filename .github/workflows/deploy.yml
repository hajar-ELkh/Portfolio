
name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build portfolio
        run: npm run build

      - name: Diagnose build output
        if: always()
        run: |
          echo "=== Current directory ==="
          pwd

          echo "=== Root files ==="
          ls -la

          echo "=== All generated index.html files ==="
          find . -maxdepth 6 -name index.html -print

          echo "=== Dist directory ==="
          ls -la dist dist/client || true

          echo "=== Public assets ==="
          for asset in cv-hajar-el-khouchali.pdf portrait.jpg favicon.svg favicon.ico; do
            if [ -f "public/$asset" ]; then
              echo "Source exists: public/$asset"
            else
              echo "Source missing: public/$asset"
            fi
            if [ -f "dist/client/$asset" ]; then
              echo "Build exists: dist/client/$asset"
            else
              echo "Build missing: dist/client/$asset"
            fi
          done

      - name: Verify homepage
        run: |
          test -f dist/client/index.html

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
