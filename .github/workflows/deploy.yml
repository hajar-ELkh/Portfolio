
name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build portfolio
        run: npm run build

      - name: Verify static pages and original public assets
        run: |
          test -f dist/client/index.html
          test "$(find dist/client/projects -name index.html | wc -l)" -eq 10
          for asset in cv-hajar-el-khouchali.pdf portrait.jpg favicon.svg favicon.ico; do
            cmp "public/$asset" "dist/client/$asset"
          done
          grep -q '/Portfolio/cv-hajar-el-khouchali.pdf' dist/client/index.html
          test ! -d dist/client/Portfolio/cv-hajar-el-khouchali.pdf

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
